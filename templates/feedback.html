{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        
        <div class="text-center mb-5">
            <h2>📢 Обратная связь</h2>
            <p class="text-muted">Есть идея или нашли ошибку? Напишите нам!</p>
        </div>

        {% if success %}
        <div class="alert alert-success shadow-sm rounded-3 p-4 text-center" role="alert">
            <h4 class="alert-heading"><i class="fa fa-check-circle"></i> Отправлено!</h4>
            <p>Спасибо за ваше сообщение. Мы обязательно его рассмотрим.</p>
            <hr>
            <a href="/" class="btn btn-outline-success">Вернуться на главную</a>
            <a href="/feedback" class="btn btn-link text-success">Написать еще</a>
        </div>
        
        {% else %}
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <form action="/feedback" method="post">
                    
                    <div class="form-group mb-3">
                        <label class="font-weight-bold text-muted small">Ваше имя (можно не заполнять)</label>
                        <input type="text" name="sender" class="form-control form-control-lg bg-light border-0" placeholder="Иван Иванов">
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold text-muted small">Тема сообщения</label>
                        <select name="category" class="form-control form-control-lg bg-light border-0">
                            <option value="Идея">💡 Предложение / Идея</option>
                            <option value="Проблема">🔥 Проблема / Ошибка</option>
                            <option value="Вопрос">❓ Вопрос</option>
                            <option value="Другое">📝 Другое</option>
                        </select>
                    </div>

                    <div class="form-group mb-4">
                        <label class="font-weight-bold text-muted small">Сообщение</label>
                        <textarea name="message" rows="5" class="form-control bg-light border-0" placeholder="Опишите суть..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg btn-block w-100" style="border-radius: 50px; font-weight: bold;">
                        Отправить сообщение <i class="fa fa-paper-plane ml-2"></i>
                    </button>
                </form>
            </div>
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
