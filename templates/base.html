<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корпоративный Портал</title>

    <link href="/admin/static/bootstrap/bootstrap4/css/bootstrap.min.css" rel="stylesheet">
    <link href="/admin/static/bootstrap/bootstrap4/css/font-awesome.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

    <style>
        /* Исправление отступов для меню (в BS4 используется ml-auto вместо ms-auto) */
        .navbar-nav.ml-auto {
            margin-left: auto !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">🏢 Direct-Line-Sale</a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <form class="form-inline my-2 my-lg-0 ml-auto" action="/search" method="get" style="display: flex;">
                    <!-- GET запросы не требуют CSRF, но для единообразия можно добавить -->
                    <input class="form-control mr-sm-2 input-search" type="search" name="q"
                        placeholder="Найти сотрудника или документ..." aria-label="Search">
                    <button class="btn btn-search my-2 my-sm-0" type="submit">
                        <i class="fa fa-search"></i>
                    </button>
                </form>

                <div class="navbar-nav">
                    <a class="nav-link" href="/">Структура</a>
                    <a class="nav-link" href="/wiki">База Знаний</a>
                    <a class="nav-link" href="/feedback">📢 Связь</a>

                    {% if current_user.is_authenticated %}
                    <a class="nav-link" href="/profile">👤 {{ current_user.username }}</a>
                    <a class="nav-link" href="/logout">🚪 Выход</a>
                    {% if current_user.role == 'admin' %}
                    <a class="nav-link" href="/admin" target="_blank">⚙️ Админка</a>
                    {% endif %}
                    {% else %}
                    <a class="nav-link" href="/login">🔐 Вход</a>
                    {% endif %}

                    <!-- Dark Mode Toggle -->
                    <button class="nav-link" id="darkModeToggle"
                        style="background: none; border: none; cursor: pointer; padding: 8px 15px;">
                        🌙
                    </button>
                </div>

            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 text-muted">
        <small>© 2026 Внутренний портал компании</small>
    </footer>

    <script src="/admin/static/vendor/jquery.min.js" defer></script>
    <script src="/admin/static/bootstrap/bootstrap4/js/bootstrap.min.js" defer></script>
    <!-- НОВОЕ: Dark Mode Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const body = document.body;

            // Проверяем сохраненную тему при загрузке
            if (localStorage.getItem('darkMode') === 'enabled') {
                body.classList.add('dark-mode');
                darkModeToggle.textContent = '☀️';
            }

            // Переключение темы
            darkModeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');

                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('darkMode', 'enabled');
                    darkModeToggle.textContent = '☀️';
                } else {
                    localStorage.removeItem('darkMode');
                    darkModeToggle.textContent = '🌙';
                }
            });
        });
    </script>

</body>

</html>
