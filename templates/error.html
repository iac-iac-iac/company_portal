<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ошибка - Корпоративный Портал</title>

	<link href="/admin/static/bootstrap/bootstrap4/css/bootstrap.min.css" rel="stylesheet">
	<link href="/admin/static/bootstrap/bootstrap4/css/font-awesome.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}

		.error-card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			padding: 60px 40px;
			max-width: 500px;
			width: 100%;
			text-align: center;
		}

		.error-icon {
			font-size: 80px;
			margin-bottom: 20px;
		}

		.error-title {
			font-size: 28px;
			font-weight: 700;
			color: #333;
			margin-bottom: 15px;
		}

		.error-message {
			color: #666;
			font-size: 16px;
			margin-bottom: 30px;
		}

		.btn-home {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			border-radius: 10px;
			padding: 14px 30px;
			font-size: 16px;
			font-weight: 700;
			color: white;
			text-decoration: none;
			display: inline-block;
			transition: transform 0.2s;
		}

		.btn-home:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			color: white;
			text-decoration: none;
		}
	</style>
</head>

<body>

	<div class="error-card">
		<div class="error-icon">⚠️</div>
		<h1 class="error-title">{{ error_title or "Произошла ошибка" }}</h1>
		<p class="error-message">{{ error_message or "Что-то пошло не так. Попробуйте позже." }}</p>
		<a href="/" class="btn-home">
			<i class="fa fa-home"></i> Вернуться на главную
		</a>
	</div>

</body>

</html>
