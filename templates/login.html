<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Вход - Корпоративный Портал</title>

	<link href="/admin/static/bootstrap/bootstrap4/css/bootstrap.min.css" rel="stylesheet">
	<link href="/admin/static/bootstrap/bootstrap4/css/font-awesome.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}

		.login-card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			overflow: hidden;
			max-width: 400px;
			width: 100%;
		}

		.login-header {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			padding: 40px 30px;
			text-align: center;
			color: white;
		}

		.login-header h2 {
			margin: 0;
			font-size: 28px;
			font-weight: 700;
		}

		.login-header p {
			margin: 10px 0 0 0;
			opacity: 0.9;
		}

		.login-body {
			padding: 40px 30px;
		}

		.form-group label {
			font-weight: 600;
			color: #333;
			margin-bottom: 8px;
		}

		.form-control {
			border-radius: 10px;
			border: 2px solid #e0e0e0;
			padding: 12px 15px;
			font-size: 15px;
			transition: all 0.3s;
		}

		.form-control:focus {
			border-color: #667eea;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
		}

		.btn-login {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			border-radius: 10px;
			padding: 14px;
			font-size: 16px;
			font-weight: 700;
			color: white;
			width: 100%;
			transition: transform 0.2s;
		}

		.btn-login:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
		}

		.btn-back {
			display: inline-block;
			margin-top: 20px;
			color: #667eea;
			text-decoration: none;
			font-weight: 600;
		}

		.btn-back:hover {
			color: #764ba2;
			text-decoration: none;
		}

		.custom-checkbox label {
			font-weight: 400;
			color: #666;
		}
	</style>
</head>

<body>

	<div class="login-card">
		<div class="login-header">
			<h2>🏢 Direct-Line-Sale</h2>
			<p>Вход в корпоративный портал</p>
		</div>

		<div class="login-body">
			{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
			{% for category, message in messages %}
			<div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show"
				role="alert">
				{{ message }}
				<button type="button" class="close" data-dismiss="alert">
					<span>&times;</span>
				</button>
			</div>
			{% endfor %}
			{% endif %}
			{% endwith %}

			<form method="post" action="{{ url_for('user_login') }}">
				<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

				<div class="form-group">
					<label for="username">
						<i class="fa fa-user"></i> Логин
					</label>
					<input type="text" class="form-control" id="username" name="username" placeholder="Введите логин"
						required autofocus>
				</div>

				<div class="form-group">
					<label for="password">
						<i class="fa fa-lock"></i> Пароль
					</label>
					<input type="password" class="form-control" id="password" name="password"
						placeholder="Введите пароль" required>
				</div>

				<div class="form-group">
					<div class="custom-control custom-checkbox">
						<input type="checkbox" class="custom-control-input" id="remember" name="remember">
						<label class="custom-control-label" for="remember">
							Запомнить меня
						</label>
					</div>
				</div>

				<button type="submit" class="btn btn-login">
					Войти <i class="fa fa-arrow-right ml-2"></i>
				</button>
			</form>

			<div class="text-center">
				<a href="{{ url_for('home') }}" class="btn-back">
					<i class="fa fa-arrow-left"></i> Вернуться на главную
				</a>
			</div>
		</div>
	</div>

	<script src="/admin/static/vendor/jquery.min.js"></script>
	<script src="/admin/static/bootstrap/bootstrap4/js/bootstrap.min.js"></script>

</body>

</html>
